ort hops stop in each. Hold or hover over a sector to see the price. Only objects in your own sector can block a warp.`,"The short-range view shows your current sector. Tap a square to move. Enemies show up as sensor contacts; a damaged sensor array blurs them over several squares. Until scanned, a contact is an unidentified hostile: you cannot tell its class. A focused scan identifies it and locks on, which makes your shots far more likely to hit. The lock follows the target as it moves, until a star comes between you; then you must scan again. Tick Auto at the end of the Lock contact button to lock on to the nearest contact in sight each time you enter a sector; it costs the same energy and time as locking by hand, and the enemy gets its turn.",`${e.torpedoes} strike the moment you fire, too fast for most ships to react, but nimble ships can jump out of the way, and the higher the level the more often they do. Weapons only reach your own sector: a torpedo burns out at the sector's edge. The ${e.beam} hits every enemy in the sector at once, weakening with distance; you choose how much energy to put in. A ${e.star} blocks fire both ways: an enemy behind one cannot hit you, and your ${e.beam} and ${e.torpedoes.toLowerCase()} cannot reach it.`,`Some enemy ships are tougher or quicker than others. Command cruisers roam between sectors and besiege your ${e.bases}: you get an alert when one arrives, and a base falls if the siege goes on too long.`,`You score points for every enemy destroyed (more for the tougher ones) and lose points for every ${e.base} lost. Win with ${e.timeUnits} to spare for a bonus. Harder levels multiply your score, and your final score earns you a rank, from ${e.lowestRank} to ${e.highestRank}.`,`Optional rule (Settings): a torpedo that hits a ${e.star} may make it go nova, destroying everything close by in that sector, including you if you are too near. The chance and the blast grow with the difficulty: never on Easy, and on Expert every hit sets
