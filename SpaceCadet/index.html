ns energy. Actions inside your sector take only part of a ${e.timeUnit}: firing ${e.fireTime}, a focused scan ${e.scanTime} and a move ${e.moveTime}. Waiting takes ${e.waitTime}. Long jumps skip the sectors in between, where short hops stop in each. Hold or hover over a sector to see the price. Only objects in your own sector can block a warp.`,"The short-range view shows your current sector. Tap a square to move. Enemies show up as sensor contacts; a damaged sensor array blurs them over several squares. Until scanned, a contact is an unidentified hostile: you cannot tell its class. A focused scan identifies it and locks on, which makes your shots far more likely to hit. The lock follows the target as it moves, until a star comes between you; then you must scan again. Tick Auto-lock beside the lock button to lock on to the nearest contact in sight each time you enter a sector; it costs the same energy and time as locking by hand, and the enemy gets its turn.",`${e.torpedoes} strike the moment you fire, too fast for most ships to react, but nimble ships can jump out of the way, and the higher the level the more often they do. Weapons only reach your own sector: a torpedo burns out at the sector's edge. The ${e.beam} hits every enemy in the sector at once, weakening with distance; you choose how much energy to put in. A ${e.star} blocks fire both ways: an enemy behind one cannot hit you, and your ${e.beam} and ${e.torpedoes.toLowerCase()} cannot reach it.`,`Some enemy ships are tougher or quicker than others. Command cruisers roam between sectors and besiege your ${e.bases}: you get an alert when one arrives, and a base falls if the siege goes on too long.`,`You score points for every enemy destroyed (more for the tougher ones) and lose points for every ${e.base} lost. Win with ${e.timeUnits} to spare for a bonus. Harder levels multiply your score, and your final score earns you a rank, from ${e.lowestRank} to ${e.highestRank}.`,`Optional rule (Settings): a torpedo that hits a ${e.star} may make it go nova, destroying everything close by in that sector, including you if you are too near. The chance and the blast grow with the difficulty: never on Easy, and on Expert every hit sets off a blast that fills the whole sector.`,`Enemies fire back. ${e.shields} protect the hull, but a heavy hit can still damage a system, and anything that gets through hits the hull and is more likely to. Damaged systems work worse: a damaged ${e.engines} loses the top warp factors first (they grey out above the map), down to warp 1 just above a quarter strength; a badly damaged one goes offline: no warp, no long-range scans, no weapons or no ${e.shields}. Damage control repairs one system quickly and the rest slowly; it starts with the worst, or tap a system in the status panel to repair it first.`,`Dock next to one of your ${e.bases} to refuel, restock and repair. Enemies hold fire while you dock.`,"Prefer typing headings, as in the original text game? Choose classic heading in Settings: tapping a square then fills in the heading (0 is right, 90 is up) and distance for you to adjust and confirm.",`You lose if your hull is destroyed, time runs out, or you are stranded with no energy and no ${e.base} next to you. Destroy the last of the ${e.enemies} with your final act, though, and the victory is yours, posthumously, with a title of its own.`]},contacts:{unidentified:e=>`unidentified ${e}`,locked:e=>`${e} (sensor lock)`,unscanned:e=>`${e} contact (unscanned)`,fuzzy:e=>`${e} contact somewhere in this area`,hull:e=>` (hull ${e}%)`}},w=vn;function Sn(e){const t=e.rules,n=(e.intel?.scanned?t.scannedMissChance:e.difficulty.unscannedMissChance+e.damage.sensors*t.sensorMissPerDamage)+e.damage.weapons*t.weaponsMissPerDamage;return Math.min(1,Math.max(0,n))}function It(e){return e.input.kind==="point"?{heading:$e(e.from,e.input.target),distance:de(e.from,e.input.target)}:{heading:ie(e.input.degrees),distance:e.input.distance??0}}function Pt(e,t,s){if(e.purpose==
